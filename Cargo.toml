[package]
name = "cmail"
version = "0.4.0"
edition = "2021"
rust-version = "1.74"
description = "Free custom-domain email with Cloudflare Email Routing"
license = "MIT"
repository = "https://github.com/luongnv89/cmail"
homepage = "https://github.com/luongnv89/cmail"
readme = "README.md"
keywords = ["email", "cloudflare", "cli", "dns", "forwarding"]
categories = ["command-line-utilities", "email"]
include = ["src/**/*", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md", ".env.example"]

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"] }
clap_complete = "4.5"
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }
signal-hook = "0.3"
unicode-width = "0.2"
ureq = "2.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
